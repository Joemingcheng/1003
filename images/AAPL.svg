<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="蘋果示意圖：手機與筆電">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B1F2A"/><stop offset="1" stop-color="#4A5572"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7FA8FF"/><stop offset="1" stop-color="#B58CFF"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>
  <g stroke="#C9D3EE" stroke-opacity=".16" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M30 80h110M30 100h80M500 70h110M520 90h90M40 290h120M40 310h90"/>
  </g>
  <!-- 筆電 -->
  <g transform="translate(250 190)">
    <rect x="-130" y="-92" width="260" height="168" rx="12" fill="#0F1320" stroke="#C9D3EE" stroke-opacity=".7" stroke-width="2"/>
    <rect x="-118" y="-80" width="236" height="144" rx="6" fill="url(#screen)" opacity=".9"/>
    <path d="M-160 80h320l-18 14h-284z" fill="#2A3147" stroke="#C9D3EE" stroke-opacity=".6" stroke-width="2"/>
    <text x="0" y="-8" text-anchor="middle" font-family="'Barlow Condensed','Arial Narrow',Arial,sans-serif" font-size="46" font-weight="700" letter-spacing="6" fill="#FFFFFF">AAPL</text>
    <text x="0" y="22" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" letter-spacing="3" fill="#EAF0FF">iPhone · Mac · Services</text>
  </g>
  <!-- 手機 -->
  <g transform="translate(450 205)">
    <rect x="-46" y="-98" width="92" height="190" rx="18" fill="#0F1320" stroke="#C9D3EE" stroke-opacity=".8" stroke-width="2.5"/>
    <rect x="-39" y="-90" width="78" height="174" rx="12" fill="url(#screen)" opacity=".85"/>
    <rect x="-16" y="-84" width="32" height="8" rx="4" fill="#0F1320"/>
    <g fill="#FFFFFF" fill-opacity=".85">
      <rect x="-28" y="-60" width="20" height="20" rx="5"/><rect x="-2" y="-60" width="20" height="20" rx="5"/>
      <rect x="-28" y="-32" width="20" height="20" rx="5"/><rect x="-2" y="-32" width="20" height="20" rx="5"/>
    </g>
  </g>
  <text x="24" y="338" font-family="'Noto Sans TC','Microsoft JhengHei',Arial,sans-serif" font-size="16" fill="#E6ECFB" font-weight="700">Apple</text>
  <text x="616" y="338" text-anchor="end" font-family="Arial,sans-serif" font-size="12" fill="#C9D3EE">NASDAQ</text>
</svg>
