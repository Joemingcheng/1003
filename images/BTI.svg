<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="英美菸草示意圖：菸葉、圓形尼古丁袋罐與一條向下的銷量線">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141C24"/><stop offset="1" stop-color="#3D5A4A"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C9A45C"/><stop offset="1" stop-color="#8A6A2E"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>
  <!-- 菸葉 -->
  <g transform="translate(170 180) rotate(-24)">
    <path d="M0 -112 C62 -70 70 30 0 112 C-70 30 -62 -70 0 -112 Z" fill="url(#leaf)" stroke="#E9D3A0" stroke-opacity=".7" stroke-width="2"/>
    <g fill="none" stroke="#5E4518" stroke-width="2" stroke-linecap="round">
      <path d="M0 -104 V104"/>
      <path d="M0 -60 L30 -78M0 -24 L42 -44M0 14 L44 -6M0 50 L34 34M0 -60 L-30 -78M0 -24 L-42 -44M0 14 L-44 -6M0 50 L-34 34"/>
    </g>
  </g>
  <!-- 圓形罐 -->
  <g transform="translate(346 214)">
    <ellipse cx="0" cy="44" rx="74" ry="14" fill="#0B1218" fill-opacity=".5"/>
    <circle r="66" fill="#E7EEF0" stroke="#A9C4B4" stroke-width="3"/>
    <circle r="50" fill="none" stroke="#3D5A4A" stroke-width="2" stroke-dasharray="3 6"/>
    <g fill="#FFFFFF" stroke="#A9C4B4" stroke-width="1.5">
      <rect x="-30" y="-20" width="26" height="16" rx="6"/><rect x="2" y="-12" width="26" height="16" rx="6"/><rect x="-18" y="6" width="26" height="16" rx="6"/>
    </g>
  </g>
  <!-- 向下的銷量線與向上的價格線 -->
  <g fill="none" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M452 96 L500 112 L548 132 L596 156" stroke="#F08A7A"/>
    <path d="M452 226 L500 210 L548 190 L596 164" stroke="#8FD9B0"/>
  </g>
  <g fill="#F08A7A"><circle cx="452" cy="96" r="5"/><circle cx="596" cy="156" r="5"/></g>
  <g fill="#8FD9B0"><circle cx="452" cy="226" r="5"/><circle cx="596" cy="164" r="5"/></g>
  <!-- 代碼 -->
  <text x="524" y="72" text-anchor="middle" font-family="'Barlow Condensed','Arial Narrow',Arial,sans-serif" font-size="62" font-weight="700" letter-spacing="5" fill="#FFFFFF">BTI</text>
  <text x="24" y="338" font-family="'Noto Sans TC','Microsoft JhengHei',Arial,sans-serif" font-size="16" fill="#E6EFEA" font-weight="700">British American Tobacco</text>
  <text x="616" y="338" text-anchor="end" font-family="Arial,sans-serif" font-size="12" fill="#A9C4B4">NYSE · ADR</text>
</svg>
