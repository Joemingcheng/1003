<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="SpaceX 示意圖：火箭、地球軌道上的衛星與資料中心">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070F"/><stop offset="1" stop-color="#1B2447"/>
    </linearGradient>
    <linearGradient id="hull" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C9D2E3"/><stop offset=".55" stop-color="#F3F6FB"/><stop offset="1" stop-color="#8E9AB3"/>
    </linearGradient>
    <radialGradient id="earth" cx=".35" cy=".3" r=".9">
      <stop offset="0" stop-color="#3E78C8"/><stop offset="1" stop-color="#0C1E44"/>
    </radialGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>
  <!-- 星點 -->
  <g fill="#FFFFFF">
    <circle cx="60" cy="50" r="1.4" opacity=".8"/><circle cx="130" cy="120" r="1" opacity=".6"/><circle cx="210" cy="40" r="1.2" opacity=".7"/><circle cx="300" cy="90" r="1" opacity=".5"/>
    <circle cx="420" cy="36" r="1.3" opacity=".8"/><circle cx="560" cy="70" r="1.1" opacity=".6"/><circle cx="600" cy="150" r="1.4" opacity=".7"/><circle cx="90" cy="220" r="1" opacity=".5"/>
    <circle cx="520" cy="230" r="1" opacity=".5"/><circle cx="470" cy="120" r="1.2" opacity=".7"/>
  </g>
  <!-- 地球與軌道上的衛星 -->
  <circle cx="470" cy="350" r="190" fill="url(#earth)"/>
  <g fill="none" stroke="#9DB7FF" stroke-opacity=".55" stroke-width="1.5">
    <ellipse cx="470" cy="350" rx="250" ry="218" stroke-dasharray="3 7"/>
    <ellipse cx="470" cy="350" rx="300" ry="262" stroke-dasharray="2 9" stroke-opacity=".35"/>
  </g>
  <g fill="#DCE6FF">
    <rect x="262" y="226" width="14" height="6" rx="1"/><rect x="318" y="170" width="14" height="6" rx="1"/><rect x="398" y="138" width="14" height="6" rx="1"/>
    <rect x="500" y="132" width="14" height="6" rx="1"/><rect x="588" y="160" width="14" height="6" rx="1"/><rect x="226" y="296" width="14" height="6" rx="1"/>
  </g>
  <!-- 火箭 -->
  <g transform="translate(168 176) rotate(32)">
    <path d="M0-112 C22-84 28-52 28-20 L28 70 L-28 70 L-28-20 C-28-52 -22-84 0-112Z" fill="url(#hull)" stroke="#5A6680" stroke-width="1.5"/>
    <path d="M-28 34 L-50 78 L-28 70ZM28 34 L50 78 L28 70Z" fill="#8E9AB3"/>
    <circle cx="0" cy="-48" r="9" fill="#101A33" stroke="#5A6680" stroke-width="1.5"/>
    <path d="M-28-6h56" stroke="#5A6680" stroke-width="1.5"/>
    <path d="M-18 70 L0 128 L18 70Z" fill="#FFB347"/>
    <path d="M-9 70 L0 104 L9 70Z" fill="#FFF2B0"/>
  </g>
  <text x="320" y="62" text-anchor="middle" font-family="'Barlow Condensed','Arial Narrow',Arial,sans-serif" font-size="30" font-weight="700" letter-spacing="5" fill="#FFFFFF">SPCX</text>
  <text x="24" y="338" font-family="'Noto Sans TC','Microsoft JhengHei',Arial,sans-serif" font-size="16" fill="#E6ECFF" font-weight="700">SpaceX</text>
  <text x="616" y="338" text-anchor="end" font-family="Arial,sans-serif" font-size="12" fill="#C8D6FF">NASDAQ</text>
</svg>
