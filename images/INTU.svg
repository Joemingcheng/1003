      <stop offset="0" stop-color="#071D2B"/><stop offset="1" stop-color="#0F7A6B"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>
  <!-- 表單 -->
  <g transform="translate(96 62)">
    <rect width="210" height="236" rx="10" fill="#F4FBF8" stroke="#9FE3CF" stroke-width="2"/>
    <rect x="20" y="22" width="96" height="12" rx="4" fill="#0F7A6B"/>
    <g fill="#C7DAD4">
