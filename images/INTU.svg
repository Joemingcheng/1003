  <text x="24" y="338" font-family="'Noto Sans TC','Microsoft JhengHei',Arial,sans-serif" font-size="16" fill="#DDF6EE" font-weight="700">Intuit</text>
  <text x="616" y="338" text-anchor="end" font-family="Arial,sans-serif" font-size="12" fill="#9FE3CF">NASDAQ</text>
